<div class="relative group px-8 py-4">
  
  <h2 class="text-white text-2xl font-semibold mb-4">{{ title }}</h2>

  <button
    (click)="scroll(movieRow, 'left')"
    class="absolute left-0 top-1/2 z-20 hidden h-[70%] -translate-y-1/2 bg-black/50 px-2 text-white group-hover:block hover:bg-black/80 transition-all"
  >
    〈
  </button>

  <div 
    #movieRow 
    class="flex overflow-x-scroll gap-4 no-scrollbar pb-4 scroll-smooth"
  >
    @for (movie of movies; track movie.id) {
      <div class="min-w-[160px] md:min-w-[200px] transition-transform duration-300 hover:scale-105 cursor-pointer">
        <img
          [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
          [alt]="movie.title || movie.name"
          class="rounded-md shadow-lg"
        />
      </div>
    }
  </div>

  <button
    (click)="scroll(movieRow, 'right')"
    class="absolute right-0 top-1/2 z-20 hidden h-[70%] -translate-y-1/2 bg-black/50 px-2 text-white group-hover:block hover:bg-black/80 transition-all"
  >
    〉
  </button>
</div>
