@if (movie) {
  <div
    class="hero-container relative w-full bg-cover bg-center transition-all duration-1000 h-screen flex flex-col justify-center pl-14"
    [style.backgroundImage]="'url(' + imageUrl + movie.backdrop_path + ')'"
  >
    <div class="">
      <div>
        <img
          class="h-14 mb-4"
          src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"
          alt="netflix-logo"
        />
        <h2 class="text-6xl font-bold mb-4">{{ movie.title || movie.name }}</h2>
        <p class="text-shadow text-lg max-w-2xl mb-4">{{ movie.overview }}</p>
      </div>
      <div class="flex gap-4 text-xl">
        <button class="play-btn text-black font-bold flex items-center pt-3 pb-3 pl-10 pr-10 rounded">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 mr-2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"
            />
          </svg>

          Lecture
        </button>
        <button class="info-btn font-bold flex items-center pt-3 pb-3 pl-10 pr-10 rounded">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 mr-2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
            />
          </svg>
          Plus d'infos
        </button>
      </div>
    </div>
  </div>
}
