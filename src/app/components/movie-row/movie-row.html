<div class="main-container group relative px-4 md:px-12 py-4">
  <h2 class="text-white text-lg md:text-2xl font-semibold mb-2 transition-colors duration-200 hover:text-gray-300 cursor-pointer">
    {{ title }}
  </h2>

  <div class="relative flex items-center">

    <button
      (click)="scroll(movieContainer, 'left')"
      class="absolute left-0 z-40 h-full w-12 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 hover:bg-black/70 text-white text-3xl hidden md:block"
    >
      〈
    </button>

    <div
      #movieContainer
      class="flex overflow-x-scroll overflow-y-hidden gap-2 no-scrollbar scroll-smooth"
    >
      @for (movie of movies; track movie.id) {
        <div class="movie-card flex-none transition-transform duration-300 ease-out hover:scale-110 hover:z-50 cursor-pointer first:ml-0">
          <img
            [src]="'https://image.tmdb.org/t/p/w342' + (isHorizontal ? movie.backdrop_path : movie.poster_path)"
            [alt]="movie.title"
            [class]="isHorizontal ? 'w-[240px] md:w-[300px] aspect-video' : 'w-[140px] md:w-[200px] aspect-[2/3]'"
            class="rounded-sm object-cover shadow-md"
          >
        </div>
      }
    </div>

    <button
      (click)="scroll(movieContainer, 'right')"
      class="absolute right-0 z-40 h-full w-12 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 hover:bg-black/70 text-white text-3xl hidden md:block"
    >
      〉
    </button>

  </div>
</div>
